name: docker publish

# Fires on a semver tag (v1.2.3) — that's the moment a version is meant to be
# installable, not every push to main. `workflow_dispatch` exists only to
# re-publish an existing tag after a registry outage; it does not create one.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to rebuild and publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # The tag IS the version: v1.2.3 -> 1.2.3, baked into the image as
      # APP_VERSION and used as the image tag below. No other source of
      # truth (package.json can drift from what was actually tagged).
      - name: Resolve version from tag
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "value=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves to every tagged release; there is no separate
      # pre-release channel yet, so every push here is meant to be current.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.value }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
